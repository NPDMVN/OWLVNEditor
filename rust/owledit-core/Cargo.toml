[package]
name = "owledit-core"
version.workspace = true
edition.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
flate2 = "1.0"
hex = "0.4"
md-5 = "0.10"
quick-xml = "0.37"
rand = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
